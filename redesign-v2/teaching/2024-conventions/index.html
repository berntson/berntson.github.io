    <meta name="theme-color" content="#1a1b26" id="theme-color-meta">
    <meta name="color-scheme" content="dark light">
    <meta name="darkreader-lock">

    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.dataset.theme = stored;
                }
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<aside class="sidebar">

    <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme="light" aria-label="Light"><span aria-hidden="true">☀</span></button>
        <button type="button" data-theme="dark" aria-label="Dark"><span aria-hidden="true">☾</span></button>
        <button type="button" data-theme="auto" aria-label="System"><span aria-hidden="true">◐</span></button>
    </div>
</aside>

        <main>
            <article class="course-overview">
                <header class="course-header">
                    <h1 class="course-title">Conventions</h1>
                    <p class="course-meta">
                        Fall 2024 · Uppsala University
                    </p>
                </header>

                
                <div class="course-description">
                    <p>A CM-level Uppsala course on conventions in philosophy. (Source syllabus
not located; description to be filled in.)</p>

                <p class="course-links">
                    <a href="syllabus/">Read syllabus</a>

        </main>

    </div>

    
<script>
    (function () {
        var buttons = document.querySelectorAll('.theme-toggle button');
        var meta = document.getElementById('theme-color-meta');
        function effectiveTheme() {
            var t = document.documentElement.dataset.theme;
            if (t === 'light' || t === 'dark') return t;
            return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        function updateMeta() {
            if (!meta) return;
            meta.setAttribute('content', effectiveTheme() === 'light' ? '#d0d5e1' : '#1a1b26');
        }
        function updateButtons() {
            var current;
            try { current = localStorage.getItem('theme'); } catch (e) { current = null; }
            if (current !== 'light' && current !== 'dark') current = 'auto';
            buttons.forEach(function (b) {
                b.setAttribute('aria-pressed', b.dataset.theme === current ? 'true' : 'false');
            });
        }
        buttons.forEach(function (b) {
            b.addEventListener('click', function () {
                var theme = b.dataset.theme;
                try {
                    if (theme === 'auto') {
                        localStorage.removeItem('theme');
                        delete document.documentElement.dataset.theme;
                    } else {
                        localStorage.setItem('theme', theme);
                        document.documentElement.dataset.theme = theme;
                    }
                } catch (e) {}
                updateButtons();
                updateMeta();
            });
        });
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateMeta);
        }
        updateButtons();
        updateMeta();
    })();

    (function () {
        var toggle = document.querySelector('.menu-toggle');
        var sidebar = document.querySelector('.sidebar');
        if (!toggle || !sidebar) return;
        toggle.addEventListener('click', function () {
            var isOpen = sidebar.dataset.menuOpen === 'true';
            sidebar.dataset.menuOpen = isOpen ? 'false' : 'true';
            toggle.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
        });
    })();
</script>
</body>
